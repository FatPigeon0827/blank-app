name: Package CAD Sketcher for Docker Hub
on:
  push:
    branches: [cad-sketcher-package]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Get CAD Sketcher 0.32.1 Linux extension from official release
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, os, zipfile
          endpoint = "https://api.github.com/repos/hlorus/CAD_Sketcher/releases/tags/v0.32.1"
          request = urllib.request.Request(endpoint, headers={"User-Agent":"cad-sketcher-docker-packager","Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(request, timeout=60) as response:
              release = json.load(response)
          assets = release.get("assets", [])
          for asset in assets:
              print("Release asset:", asset["name"])
          matches = [a for a in assets if a["name"].lower().endswith(".zip") and "linux" in a["name"].lower()]
          if len(matches) != 1:
              raise RuntimeError(f"Expected exactly one Linux ZIP asset in official v0.32.1 release, found {len(matches)}")
          url = matches[0]["browser_download_url"]
          req = urllib.request.Request(url, headers={"User-Agent":"cad-sketcher-docker-packager"})
          with urllib.request.urlopen(req, timeout=120) as resp, open("cad-sketcher-linux.zip", "wb") as out:
              while True:
                  chunk=resp.read(1024*1024)
                  if not chunk: break
                  out.write(chunk)
          size=os.path.getsize("cad-sketcher-linux.zip")
          print("Downloaded Linux ZIP bytes:",size)
          if not (0<size<2_000_000_000):
              raise RuntimeError("ZIP is empty or exceeds 2 GB limit")
          with zipfile.ZipFile("cad-sketcher-linux.zip") as z:
              if z.testzip():
                  raise RuntimeError("Invalid ZIP file")
          PY
      - name: Prepare minimal container with ZIP payload
        run: |
          printf 'FROM alpine:3.21\nWORKDIR /payload\nCOPY cad-sketcher-linux.zip /payload/cad-sketcher-linux.zip\nCMD ["sh"]\n' > Dockerfile.cad
      - name: Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cad
          push: true
          platforms: linux/amd64
          tags: ${{ vars.DOCKERHUB_USERNAME }}/cad-sketcher:0.32.1
